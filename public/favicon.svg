<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#1a2e26"/>
  <!-- Stylised "V" mark — two angular strokes forming a V with teal color -->
  <path d="M7 8 L16 24 L25 8" stroke="#00b294" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Small horizontal line accent at top — represents packaging layers -->
  <line x1="10" y1="8" x2="22" y2="8" stroke="#00b294" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
</svg>
